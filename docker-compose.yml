version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leaderboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres automatically runs all *.sql files in docker-entrypoint-initdb.d/ on first start
      - ./migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
  leaderboard:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/leaderboard?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
volumes:
  pgdata:
