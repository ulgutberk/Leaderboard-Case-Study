services:
  postgres-primary:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leaderboard
    command: >-
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c wal_keep_size=64
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c wal_log_hints=on
    ports:
      - "5432:5432"
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:15
    environment:
      PGPASSWORD: replicator_pass
    command: >-
      bash -c "rm -rf /var/lib/postgresql/data/* /var/lib/postgresql/data/.[!.]* 2>/dev/null || true; until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R --no-password; do sleep 2; done && chown -R postgres:postgres /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data && exec gosu postgres postgres"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
  redis-master:
    image: bitnami/redis:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_REPLICATION_MODE: master
    ports:
      - "6379:6379" # Expose master for direct access for development/testing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-slave1:
    image: bitnami/redis:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: "6379"
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6380:6379" # Expose slave for direct access for development/testing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-slave2:
    image: bitnami/redis:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: "6379"
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6381:6379" # Expose slave for direct access for development/testing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_MASTER_SET: mymaster
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_SENTINEL_QUORUM: "2"
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: "10000"
      REDIS_SENTINEL_FAILOVER_TIMEOUT: "10000"
      REDIS_SENTINEL_RESOLVE_HOSTNAMES: "yes"
      REDIS_SENTINEL_ANNOUNCE_HOSTNAMES: "yes"
      REDIS_SENTINEL_PORT_NUMBER: "26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_healthy
      redis-slave2:
        condition: service_healthy
    ports:
      - "26379:26379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_MASTER_SET: mymaster
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_SENTINEL_QUORUM: "2"
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: "10000"
      REDIS_SENTINEL_FAILOVER_TIMEOUT: "10000"
      REDIS_SENTINEL_RESOLVE_HOSTNAMES: "yes"
      REDIS_SENTINEL_ANNOUNCE_HOSTNAMES: "yes"
      REDIS_SENTINEL_PORT_NUMBER: "26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_healthy
      redis-slave2:
        condition: service_healthy
    ports:
      - "26380:26379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_MASTER_SET: mymaster
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_SENTINEL_QUORUM: "2"
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: "10000"
      REDIS_SENTINEL_FAILOVER_TIMEOUT: "10000"
      REDIS_SENTINEL_RESOLVE_HOSTNAMES: "yes"
      REDIS_SENTINEL_ANNOUNCE_HOSTNAMES: "yes"
      REDIS_SENTINEL_PORT_NUMBER: "26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_healthy
      redis-slave2:
        condition: service_healthy
    ports:
      - "26381:26379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  monitor:
    build: ./monitor
    depends_on:
      - leaderboard
    environment:
      ALERT_EMAIL_TO: ulgutberk@gmail.com
      ALERT_EMAIL_FROM: ulgutberk@gmai.com
    volumes:
      - ./monitor/msmtprc:/etc/msmtp/msmtprc:ro
    restart: unless-stopped

  leaderboard:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgres://postgres:postgres@pgbouncer:5432/leaderboard?sslmode=disable
      REDIS_MASTER_NAME: mymaster
      REDIS_SENTINEL_ADDR: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres-primary
      DB_NAME: leaderboard
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:rw
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-d", "leaderboard", "-U", "postgres"]
      interval: 5s
      retries: 10

  failover-watcher:
    build: ./failover
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:rw
      - ./monitor/msmtprc:/etc/msmtp/msmtprc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ALERT_EMAIL_TO: ulgutberk@gmail.com
      ALERT_EMAIL_FROM: ulgutberk@gmail.com
    depends_on:
      - pgbouncer
      - postgres-replica
    restart: unless-stopped

volumes:
  pgdata-primary:
  pgdata-replica:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:


